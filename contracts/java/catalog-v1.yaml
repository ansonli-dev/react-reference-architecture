openapi: 3.1.0
info:
  title: Java catalog v1 read-only subset
  version: 1.0.0
  description: Source-derived subset pending live OpenAPI verification.
externalDocs:
  url: https://github.com/ansonli-dev/explicit-architecture/tree/14e511a8f361616e166f23daf5184012d501c656/catalog
paths:
  /api/v1/books:
    get:
      operationId: listJavaBooks
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: An array without pagination metadata.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookResponse' }
  /api/v1/books/{id}:
    get:
      operationId: getJavaBook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Book detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookResponse' }
        '404':
          description: Unknown book.
components:
  schemas:
    BookResponse:
      type: object
      required: [id, title, author, category, priceCents, currency, stock]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        category: { type: string }
        priceCents: { type: integer, format: int64 }
        currency: { type: string }
        stock: { type: integer, format: int32 }
