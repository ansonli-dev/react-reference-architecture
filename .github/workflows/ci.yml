name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - name: Check generated OpenAPI types
        run: |
          pnpm api:generate
          git diff --exit-code -- src/shared/api/generated src/server/adapters/java/generated
          generated_changes="$(git status --porcelain --untracked-files=all -- src/shared/api/generated src/server/adapters/java/generated)"
          if [ -n "$generated_changes" ]; then
            printf '%s\n' "$generated_changes"
            exit 1
          fi
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/e2e/
          if-no-files-found: ignore
  visual:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-visual.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-results
          path: test-results/visual-container/
          if-no-files-found: ignore
  release-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-release.sh
