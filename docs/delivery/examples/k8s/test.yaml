# docker-desktop / rra-test. Image and backend runtime configuration are intentionally unbound.
apiVersion: 'apps/v1'
kind: 'Deployment'
metadata:
  name: 'bookstore'
  namespace: 'rra-test'
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: 'bookstore'
  strategy:
    type: 'RollingUpdate'
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: 'bookstore'
      annotations:
        rra.example/state: 'preview-unbound'
    spec:
      nodeSelector:
        kubernetes.io/os: 'linux'
        kubernetes.io/arch: 'arm64'
      serviceAccountName: 'bookstore'
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: 'RuntimeDefault'
      containers:
        - name: 'bookstore'
          image: 'registry.invalid/bookstore:unbound'
          imagePullPolicy: 'IfNotPresent'
          ports:
            - name: 'http'
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: 'bookstore-runtime-v1'
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - 'ALL'
          startupProbe:
            httpGet:
              path: '/api/health'
              port: 'http'
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: '/api/health'
              port: 'http'
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: '/api/ready'
              port: 'http'
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: 'v1'
kind: 'Service'
metadata:
  name: 'bookstore'
  namespace: 'rra-test'
spec:
  type: 'ClusterIP'
  selector:
    app: 'bookstore'
  ports:
    - name: 'http'
      port: 3000
      targetPort: 'http'
---
apiVersion: 'v1'
kind: 'ConfigMap'
metadata:
  name: 'bookstore-runtime-v1'
  namespace: 'rra-test'
immutable: true
data:
  APP_ORIGIN: 'http://127.0.0.1:3200'
  BOOKSTORE_HOST: '0.0.0.0'
