# Review-only preview. Provision only after activation review.
apiVersion: 'v1'
kind: 'Namespace'
metadata:
  name: 'rra-develop'
---
apiVersion: 'v1'
kind: 'ResourceQuota'
metadata:
  name: 'bookstore'
  namespace: 'rra-develop'
spec:
  hard:
    requests.cpu: '2'
    requests.memory: '2Gi'
    limits.cpu: '2'
    limits.memory: '2Gi'
    pods: '10'
---
apiVersion: 'v1'
kind: 'LimitRange'
metadata:
  name: 'bookstore'
  namespace: 'rra-develop'
spec:
  limits:
    - type: 'Container'
      max:
        cpu: '1'
        memory: '1Gi'
      defaultRequest:
        cpu: '100m'
        memory: '128Mi'
      default:
        cpu: '500m'
        memory: '512Mi'
---
apiVersion: 'v1'
